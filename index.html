<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>正在定位自建项目…</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#e6edf3;
       font:15px/1.65 ui-sans-serif,system-ui,"Segoe UI","Noto Sans SC",sans-serif;padding:24px}
  .card{width:100%;max-width:520px;padding:32px 34px;border:1px solid #1f2a36;border-radius:18px;
        background:linear-gradient(180deg,#111823,#0e141c);box-shadow:0 20px 60px -30px #000}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .dot{width:9px;height:9px;border-radius:50%;background:#8b98a5;box-shadow:0 0 0 4px #ffffff0d;
       animation:pulse 1.6s ease-in-out infinite}
  .dot.ok{background:#3fb950;animation:none;box-shadow:0 0 0 4px #3fb95022}
  .dot.warn{background:#d29922;animation:none;box-shadow:0 0 0 4px #d2992222}
  .dot.bad{background:#f85149;animation:none;box-shadow:0 0 0 4px #f8514922}
  @keyframes pulse{50%{opacity:.35}}
  .label{font-size:13px;letter-spacing:.02em;color:#8b98a5}
  h1{font-size:19px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
  p{margin:8px 0;color:#8b98a5}
  a{color:#58a6ff;text-decoration:none}
  a:hover{text-decoration:underline}
  .target{margin:16px 0;padding:12px 14px;border:1px solid #1f2a36;border-radius:10px;background:#0b1017;
          font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:#7ee787;
          word-break:break-all;min-height:20px}
  .meta{font-size:12px;color:#6e7b88;margin-top:14px;display:flex;justify-content:space-between;gap:12px}
  button{margin-top:18px;width:100%;padding:11px 16px;border-radius:10px;border:1px solid #2a3b4d;
         background:#16202c;color:#e6edf3;font:inherit;font-size:14px;cursor:pointer}
  button:hover{background:#1b2836}
  button[disabled]{opacity:.45;cursor:default}
  .hint{font-size:12px;color:#5b6875;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="row"><span class="dot" id="dot"></span><span class="label" id="state">正在读取最新地址…</span></div>
  <h1 id="title">这个固定域名背后，是我自己的电脑</h1>
  <p id="desc">页面会自动跳转到当前有效的隧道地址。</p>
  <div class="target" id="target">—</div>
  <button id="go" disabled>打开项目</button>
  <div class="meta"><span id="updated">—</span><span id="countdown"></span></div>
  <div class="hint">本地服务可能离线；地址由本机自动上报，通常几十秒内生效。</div>
</div>
<noscript><p style="color:#f85149">需要启用 JavaScript 才能自动跳转。</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
